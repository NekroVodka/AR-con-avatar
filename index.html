<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Reto AR — Saluda a tu avatar</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #111827; }
    .panel { position: fixed; z-index: 5; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; color: white; pointer-events: none; }
    .panel-inner { max-width: 520px; margin: 0 auto; padding: 14px 16px; border: 1px solid #ffffff30; border-radius: 16px; background: #111827d9; box-shadow: 0 8px 30px #0004; }
    h1 { margin: 0 0 5px; font-size: clamp(18px, 4vw, 25px); }
    p { margin: 0; line-height: 1.4; font-size: 14px; color: #e5e7eb; }
    .status { margin-top: 7px; color: #a7f3d0; font-weight: 600; }
    .a-enter-vr, .a-enter-ar { z-index: 10 !important; }
    .hint { margin-top: 5px; color: #cbd5e1; font-size: 12px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-inner">
      <h1>👋 ¡Saluda a tu avatar!</h1>
      <p>Pulsa el botón de AR para verlo en tu entorno real. Permite el acceso a la cámara si el navegador lo solicita.</p>
      <p class="status" id="status">Avatar cargando…</p>
      <p class="hint">En móvil compatible, abre esta página con HTTPS y pulsa “Entrar en AR”. En ordenador puedes ver el modelo en 3D.</p>
    </div>
  </div>

  <a-scene
    xr-mode-ui="XRMode: xr;"
    webxr="optionalFeatures: hit-test, local-floor, bounded-floor;"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    background="color: #202938"
    loading-screen="dotsColor: #34d399; backgroundColor: #111827">

    <a-assets timeout="15000">
      <a-asset-item id="avatarModel" src="./Twerk_personaje.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.1" position="1 3 2"></a-entity>

    <!-- Suelo para la vista 3D normal; en AR el fondo real procede de la cámara. -->
    <a-plane rotation="-90 0 0" width="8" height="8" color="#64748b" material="roughness: 1"></a-plane>

    <a-entity id="avatar"
      gltf-model="#avatarModel"
      position="0 0 -1.5"
      rotation="0 180 0"
      scale="1 1 1"
      animation-mixer="clip: *; loop: repeat"
      shadow="cast: true; receive: false">
    </a-entity>

    <a-entity position="0 2.2 -1.5">
      <a-text value="¡Hola! 👋" align="center" color="#ffffff" width="4"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
    </a-entity>

    <a-entity camera look-controls position="0 1.6 2.5"></a-entity>
  </a-scene>

  <script>
    const avatar = document.querySelector('#avatar');
    const status = document.querySelector('#status');
    avatar.addEventListener('model-loaded', () => status.textContent = '¡Avatar listo! Está reproduciendo su baile.');
    avatar.addEventListener('model-error', () => status.textContent = 'No se pudo cargar el modelo. Comprueba que Twerk_personaje.glb esté junto a index.html.');
  </script>
</body>
</html>
